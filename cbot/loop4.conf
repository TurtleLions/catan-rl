# Defaults for cbot/loop4.sh. To change a running loop, put overrides in
# runs/loop4.conf (same syntax); it is re-read at the start of every round.

# Stop after this round. The round to run next comes from runs/loop4.log.
LAST_ROUND=8

GAMES=30000       # games generated per round
EVAL_GAMES=1000   # vs 3 AlphaBetas
EVAL_SEED0=20000000  # 40000000 = the cbot/slurm/evalset.sbatch seeds

# Training data: round 0 plus this many most recent rounds. Each round adds
# ~7.5M rows (~2.7 GB per trainer); see trainset.sbatch for the memory needed.
TRAIN_BACK=2

# Table mix for generation: "seat,seat,seat,seat:weight ...", BEST = current best bot.
MIX="BEST,AB,AB,AB:4 BEST,BEST,AB,AB:2 BEST,AB,AB,F:1 BEST,BEST,BEST,BEST:1"
# Mostly self-play (keeps some AlphaBeta tables so the net still sees that style):
# MIX="BEST,BEST,BEST,BEST:6 BEST,BEST,AB,AB:1 BEST,AB,AB,AB:1"

# Head-to-head eval: candidate vs three copies of the current best, seeds 30M,
# seats rotated, so 0.25 = equal strength. 0 = skip.
H2H_GAMES=0

# Search options added to the bot's spec in generation and in both evals, e.g.
# ":depth=3" (about 3.5x the time per decision, ~+2-3 points vs 3AB). The best
# rate in runs/best4_rate.txt must have been measured with the same options.
SEARCH=""

# Cores of the leader that play the posted next round while it trains (the
# trainers get the rest); 0 = off. Default: half of them (see loop4.sh).
GEN_WHILE_TRAINING=$(( P / 2 ))

# Which result picks the next generator:
#   ab  - adopt unless vs-3AB is more than GATE_TOL below the best so far
#   h2h - adopt if head-to-head >= H2H_MIN (needs H2H_GAMES > 0)
#   both - adopt only if both of the above hold (needs H2H_GAMES > 0)
GATE=ab
GATE_TOL=0.03
H2H_MIN=0.25
